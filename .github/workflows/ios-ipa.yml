name: Build iOS IPA + Android APK

# Запуск вручную: вкладка Actions → «Build iOS IPA + Android APK» → «Run workflow».
# Или автоматически при пуше тега вида v1.0.0.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Способ экспорта .ipa (development / ad-hoc / app-store)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ---------------------------------------------------------------------------
  # iOS: .ipa собирается ТОЛЬКО на macOS-раннере (нужен Xcode + codesign).
  # ВАЖНО: контекст secrets нельзя использовать в `if:` шага — поэтому
  # значения из secrets сначала попадают в env уровня job, а в `if:`
  # проверяется уже env (это разрешено).
  # ---------------------------------------------------------------------------
  ios-ipa:
    name: iOS .ipa (macOS)
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SIGNING_CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      SIGNING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      SIGNING_P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      SIGNING_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      # 'yes' только если оба секрета подписи реально заданы
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' && 'yes' || 'no' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Показать версию Xcode
        run: xcodebuild -version

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # ------------------------- ВАРИАНТ A: без подписи -------------------------
      # Даёт рабочий .ipa, который подписывается Apple ID на устройстве
      # через Sideloadly / AltStore (7 дней на бесплатном аккаунте).
      - name: Сборка без подписи (unsigned .app)
        run: flutter build ios --release --no-codesign

      - name: Упаковать unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Не найден $APP_PATH"; exit 1
          fi
          rm -rf build/ios/unsigned build/ios/ipa-unsigned
          mkdir -p build/ios/unsigned/Payload build/ios/ipa-unsigned
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          zip -qry "$GITHUB_WORKSPACE/build/ios/ipa-unsigned/MyShifts-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/build/ios/ipa-unsigned/"

      - name: Загрузить unsigned .ipa
        uses: actions/upload-artifact@v5
        with:
          name: MyShifts-unsigned-ipa
          path: build/ios/ipa-unsigned/MyShifts-unsigned.ipa
          if-no-files-found: error

      # ---------------------- ВАРИАНТ B: подписанный .ipa ----------------------
      # Включается сам, если в репозитории заданы секреты:
      #   BUILD_CERTIFICATE_BASE64     — .p12 сертификата в base64
      #   P12_PASSWORD                 — пароль .p12
      #   KEYCHAIN_PASSWORD            — любой пароль для временной связки ключей
      #   PROVISIONING_PROFILE_BASE64  — .mobileprovision в base64
      #   DEVELOPMENT_TEAM             — Team ID (10 символов) из аккаунта Apple
      - name: Импорт сертификата и профиля
        if: ${{ env.HAS_SIGNING == 'yes' }}
        run: |
          set -euo pipefail
          decode_b64() {
            printf '%s' "$1" | base64 --decode > "$2" 2>/dev/null \
              || printf '%s' "$1" | base64 -D > "$2"
          }

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          decode_b64 "$SIGNING_CERT_BASE64" "$CERT_PATH"
          decode_b64 "$SIGNING_PROFILE_BASE64" "$PROFILE_PATH"

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$SIGNING_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Сборка подписанного .ipa
        if: ${{ env.HAS_SIGNING == 'yes' }}
        run: |
          set -euo pipefail
          flutter build ipa \
            --release \
            --export-method=${{ inputs.export_method || 'development' }} \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }} \
            --xcargs "DEVELOPMENT_TEAM=${SIGNING_TEAM} -allowProvisioningUpdates"

      - name: Загрузить подписанный .ipa
        if: ${{ env.HAS_SIGNING == 'yes' }}
        uses: actions/upload-artifact@v5
        with:
          name: MyShifts-signed-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android: APK как побочный артефакт (локально нет Android SDK)
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK (ubuntu)
    # Явная версия: label ubuntu-latest с 19.10.2026 мигрирует на Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установить JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализатор и тесты
        run: |
          flutter analyze
          flutter test

      - name: Сборка APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Загрузить APK
        uses: actions/upload-artifact@v5
        with:
          name: MyShifts-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
