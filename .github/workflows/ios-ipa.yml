name: Build iOS IPA + Android APK

# Запуск вручную из вкладки Actions («Build iOS IPA + Android APK» → «Run workflow»)
# или автоматически при пуше тега вида v1.0.0
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Способ экспорта .ipa (development / ad-hoc / app-store)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.47.9'
  BUNDLE_ID: 'com.ashtr.shifts'

jobs:
  # ---------------------------------------------------------------------------
  # iOS: .ipa собирается ТОЛЬКО на macOS-раннере (нужен Xcode + codesign)
  # ---------------------------------------------------------------------------
  ios-ipa:
    name: iOS .ipa (macOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Показать версию Xcode
        run: xcodebuild -version

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # ------------------------- ВАРИАНТ A: без подписи -------------------------
      # Даёт рабочий .ipa, который затем подписывается на своём Apple ID
      # через Sideloadly / AltStore / iOS App Signer (7 дней на бесплатном аккаунте).
      - name: Сборка без подписи (unsigned .app)
        run: flutter build ios --release --no-codesign

      - name: Упаковать unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          rm -rf build/ios/unsigned build/ios/ipa-unsigned
          mkdir -p build/ios/unsigned/Payload build/ios/ipa-unsigned
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          # shellcheck disable=SC2035
          zip -qry "$GITHUB_WORKSPACE/build/ios/ipa-unsigned/MyShifts-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/build/ios/ipa-unsigned/"

      - name: Загрузить unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MyShifts-unsigned-ipa
          path: build/ios/ipa-unsigned/MyShifts-unsigned.ipa
          if-no-files-found: error

      # ---------------------- ВАРИАНТ B: подписанный .ipa ----------------------
      # Включается автоматически, если в репозитории заданы секреты:
      #   BUILD_CERTIFICATE_BASE64  — .p12 сертификата Apple Distribution/Development в base64
      #   P12_PASSWORD              — пароль .p12
      #   KEYCHAIN_PASSWORD         — любой пароль для временной связки ключей
      #   PROVISIONING_PROFILE_BASE64 — .mobileprovision в base64
      #   DEVELOPMENT_TEAM          — Team ID (10 символов) из аккаунта разработчика
      - name: Импорт сертификата и профиля
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Сборка подписанного .ipa
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          flutter build ipa \
            --release \
            --export-method=${{ inputs.export_method || 'development' }} \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }} \
            --xcargs "DEVELOPMENT_TEAM=${DEVELOPMENT_TEAM} -allowProvisioningUpdates"

      - name: Загрузить подписанный .ipa
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MyShifts-signed-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android: APK как побочный артефакт (Windows-машина без Android SDK)
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Тесты и анализатор
        run: |
          flutter analyze
          flutter test

      - name: Сборка APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MyShifts-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
